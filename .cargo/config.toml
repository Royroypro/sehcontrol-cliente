[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-args=/NODEFAULTLIB:MSVCRT"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
[target.'cfg(target_os="macos")']
rustflags = [
    "-C", "link-args=-sectcreate __CGPreLoginApp __cgpreloginapp /dev/null",
]
#[target.'cfg(target_os="linux")']
# glibc-static required, this may fix https://github.com/rustdesk/rustdesk/issues/9103, but I do not want this big change
# this is unlikely to help also, because the other so files still use libc dynamically
#rustflags = [
#    "-C", "link-args=-Wl,-Bstatic -lc -Wl,-Bdynamic"
#]
[net]
git-fetch-with-cli = true

# Android cross-compilation from a Windows host. Set here (not via shell
# `export`) so it's read directly by cargo regardless of which shell/
# background process invokes it.
#
# CC/CXX point at renamed *copies* of the NDK's versioned clang wrappers
# (myclang-arm64.cmd, not aarch64-linux-android21-clang.cmd) rather than the
# originals. cc-rs deliberately rewrites any path whose filename matches the
# NDK's "<target>-clang" pattern - it swaps in the underlying bare clang.exe
# via PathBuf::set_file_name() to dodge Windows's ~8k command-line limit -
# and that rewrite joins the (forward-slash) directory with the new filename
# using Windows's native backslash. MSYS2 bash/make then reads that
# backslash as a shell escape character and swallows it, turning
# ".../bin\clang.exe" into the literal, nonexistent "binclang.exe". A
# same-directory copy under a name that doesn't match the pattern (it still
# calls the real clang.exe via its own %~dp0) sidesteps the rewrite so the
# forward-slash path we set survives intact into the Makefile.
[target.aarch64-linux-android]
linker = "C:/Users/rdrf-/AppData/Local/Android/Sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/windows-x86_64/bin/myclang-arm64.cmd"

# Toolchain nativo de Windows. Aqui y no como variables de entorno del
# sistema para que cargo las lea venga de donde venga la invocacion: la
# consola preparada, VS Code, una terminal cualquiera o un proceso en
# segundo plano. Mismo criterio que las de Android de abajo.
#
# `force = true` es imprescindible, no cosmetico: por defecto una entrada de
# [env] NO pisa una variable que ya venga del entorno, y estas tres estan
# definidas a nivel de Usuario/Maquina con valores que ya no existen
# (LIBCLANG_PATH a un LLVM sin libclang.dll, VCPKG_ROOT de maquina a D:\vcpkg
# y BINDGEN_EXTRA_CLANG_ARGS a un E:\vcpkg de otra instalacion). Sin force
# ganarian esas y el fallo de bindgen seria el de siempre.
#
# BINDGEN_EXTRA_CLANG_ARGS se deja vacia a proposito: las cabeceras tienen
# que salir de VCPKG_ROOT y de vcvars64, no de una tercera instalacion.
[env]
LIBCLANG_PATH = { value = "C:/LLVM15/bin", force = true }
VCPKG_ROOT = { value = "C:/vcpkg-sehcontrol", force = true }
BINDGEN_EXTRA_CLANG_ARGS = { value = "", force = true }

CC_aarch64_linux_android = "C:/Users/rdrf-/AppData/Local/Android/Sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/windows-x86_64/bin/myclang-arm64.cmd"
CXX_aarch64_linux_android = "C:/Users/rdrf-/AppData/Local/Android/Sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/windows-x86_64/bin/myclangxx-arm64.cmd"
AR_aarch64_linux_android = "C:/Users/rdrf-/AppData/Local/Android/Sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
# libsodium para ARM64, que el build.rs parcheado de libsodium-sys busca aqui
# para emitir `rustc-link-lib=static=sodium`.
#
# Apuntaba a %TEMP%\libsodium-build\out-arm64. Windows limpia %TEMP% por
# diseno, asi que el .a acababa desapareciendo y el build de Android moria con
# "could not find native static library `sodium`" -- despues de compilar unos
# 500 crates, y sin que el mensaje mencione %TEMP% por ningun lado.
#
# Ahora vive en el vcpkg del proyecto, junto a los otros paquetes del mismo
# triplete (aom, libvpx, opus, oboe...), que es donde se resuelve todo lo demas
# de arm64-android y no lo borra nadie. Se instala con:
#   vcpkg install libsodium:arm64-android
SODIUM_LIB_DIR = "C:/vcpkg-sehcontrol/installed/arm64-android/lib"
